port: 7880
bind_addresses:
  - "0.0.0.0"

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  congestion_control:
    enabled: true
    allow_pause: true

redis:
  address: redis:6379
  password: __REDIS_PASSWORD__

# Supply production keys with LIVEKIT_KEYS="api-key: api-secret" or render
# this template from your deployment secret store.

room:
  auto_create: false
  empty_timeout: 300
  departure_timeout: 30
  max_participants: 50

turn:
  # deploy/enable-livekit-turn.sh replaces this block after Certbot succeeds.
  enabled: false

logging:
  level: info
  json: true

prometheus_port: 6789
