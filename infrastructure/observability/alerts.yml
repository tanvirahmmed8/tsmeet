groups:
  - name: tsmeet
    rules:
      - alert: RecordingFailure
        expr: increase(tsmeet_recording_failures_total[10m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations: { summary: 'A TSMeet recording failed' }
      - alert: HostDiskNearlyFull
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.15
        for: 10m
        labels: { severity: warning }
        annotations: { summary: 'Host disk has less than 15% free space' }
      - alert: HighHostCPU
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.85
        for: 10m
        labels: { severity: warning }
      - alert: HighHostMemory
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9
        for: 10m
        labels: { severity: warning }
      - alert: LiveKitDown
        expr: up{job="livekit"} == 0
        for: 2m
        labels: { severity: critical }
      - alert: HighMediaEgressBandwidth
        expr: sum(rate(livekit_packet_bytes{direction="outgoing"}[5m])) > 1000000000
        for: 10m
        labels: { severity: warning }
        annotations: { summary: 'LiveKit egress exceeds 1 GB/s' }
