<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TSMeet Recorder Worker</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #020817;
        color: #e2e8f0;
      }
      main {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }
      .pill {
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 999px;
        padding: 10px 16px;
        background: rgba(255,255,255,.04);
      }
      .error {
        color: #fda4af;
        max-width: 720px;
      }
    </style>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
  </head>
  <body>
    <main>
      <h1>TSMeet Recorder Worker</h1>
      <div class="pill" id="session"></div>
      <div class="pill" id="status">Status: booting</div>
      <div class="pill" id="peers">Connected peers: 0</div>
      <p class="error" id="error"></p>
    </main>
    <script src="/recorder-assets/recorder.js"></script>
  </body>
</html>
